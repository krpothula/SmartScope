{% load static %}
<link rel="stylesheet" href="{% static 'dialogueform.css' %}">

{% if instance.targets_prefix == 'hole' %}
<li class="nav-item dropdown">
    <a class="nav-link dropdown-toggle" href="#" id="allHolesDropdown" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        All Holes 
    </a>
    <ul class="dropdown-menu" aria-labelledby="allHolesDropdown">
        <li>
            <button class="dropdown-item" onmousedown="queueSquareTargets(this)" value="addall">Queue all holes</button>
        </li>
        <li>
            <button class="dropdown-item" onmousedown="queueSquareTargets(this)" value="cancelall">Cancel all holes</button>
        </li>
        <li>
            <button id="regroupBIS" class="dropdown-item" onmousedown="regroupBIS('{{instance.pk}}')">Regroup BIS</button>
        </li>
        <li>
            <button id="deleteHoles" class="dropdown-item" onmousedown="deleteHoles('{{instance.pk}}')">Delete Holes</button>
        </li>
        <li class="dropdown-submenu">
            <a class="dropdown-item dropdown-toggle" href="#" id="extendLatticeDropdown" data-instance-pk="{{ instance.pk }}" data-grid-id="{{ instance.grid_id.pk }}">
                Extend Lattice
            </a>
            <ul class="dropdown-menu" aria-labelledby="extendLatticeDropdown">
                <li>
                    <button class="dropdown-item" onmousedown="extendLattice('{{instance.pk}}')">Default</button>
                </li>
                <li>
                    <button class="dropdown-item" onmousedown="openExtendLatticeForm('{{ instance.pk }}', '{{ instance.grid_id.pk }}')">Interactive</button>
                </li>
            </ul>
        </li>
    </ul>
</li>

<li class="nav-item dropdown" data-bs-toggle="tooltip" title="Hold Shift+click to start adding new targets on the image">
    <a class="nav-link dropdown-toggle disabled" href="#" id="addTargetsBtn" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        New targets 
    </a>
    <ul class="dropdown-menu">
        <li>
            <button id="addTargets" class="dropdown-item" onclick="addTargets(this, targetsSelection)">Add Targets</button>
        </li>
        <li>
            <button id="clearTargets" class="dropdown-item" onclick="clearSelection(targetsSelection, 'targets')">Clear Targets</button>
        </li>
    </ul>
</li>
{% else %}
<li class="nav-item dropdown">
    <a class="nav-link dropdown-toggle" href="#" id="allHolesDropdownElse" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        All Holes
    </a>
    <ul class="dropdown-menu" aria-labelledby="allHolesDropdownElse">
        <li>
            <button id="regroupBIS" class="dropdown-item" onclick="regroupBIS('{{instance.grid_id.pk}}', getRegroupBISallUrl)">Regroup BIS</button>
        </li>
    </ul>
</li>
{% endif %}

<!-- Hidden Form -->
<div id="dialogueForm" class="dialogue-form" style="font-size: 13px;">
    <p class="mb-2 fw-bold">Extend Lattice Parameters</p>
    <form id="extendLatticeForm">
        <div class="form-group row g-1 mb-1">
            <label for="squareMeshSpacing" class="col-7 col-form-label py-0 text-start">Square Mesh Spacing (μm)</label>
            <div class="col-5">
                <input type="number" class="form-control form-control-sm py-0" style="font-size: 13px;" id="squareMeshSpacing" name="square_mesh_spacing" step="0.01" placeholder="85">
            </div>
        </div>
        <div class="form-group row g-1 mb-1">
            <label for="squareMeshRotation" class="col-7 col-form-label py-0 text-start">Square Mesh Rotation (°)</label>
            <div class="col-5">
                <input type="number" class="form-control form-control-sm py-0" style="font-size: 13px;" id="squareMeshRotation" name="square_mesh_rotation" step="0.01" placeholder="0">
            </div>
        </div>
        <div class="form-group row g-1 mb-1">
            <label for="holeSquareSpacing" class="col-7 col-form-label py-0 text-start">Hole Square Spacing (μm)</label>
            <div class="col-5">
                <input type="number" class="form-control form-control-sm py-0" style="font-size: 13px;" id="holeSquareSpacing" name="hole_square_spacing" step="0.01" placeholder="1.2" required>
            </div>
        </div>
        <div class="form-group row g-1 mb-1">
            <label for="holeSquareRotation" class="col-7 col-form-label py-0 text-start">Hole Square Rotation (°)</label>
            <div class="col-5">
                <input type="number" class="form-control form-control-sm py-0" style="font-size: 13px;" id="holeSquareRotation" name="hole_square_rotation" step="0.01" placeholder="0" required>
            </div>
        </div>
        <div class="form-group row g-1 mb-1">
            <label for="holeMedmagSpacing" class="col-7 col-form-label py-0 text-start">Hole MedMag Spacing (μm)</label>
            <div class="col-5">
                <input type="number" class="form-control form-control-sm py-0" style="font-size: 13px;" id="holeMedmagSpacing" name="hole_medmag_spacing" step="0.01" placeholder="1.2">
            </div>
        </div>
        <div class="form-group row g-1 mb-1">
            <label for="holeMedmagRotation" class="col-7 col-form-label py-0 text-start">Hole MedMag Rotation (°)</label>
            <div class="col-5">
                <input type="number" class="form-control form-control-sm py-0" style="font-size: 13px;" id="holeMedmagRotation" name="hole_medmag_rotation" step="0.01" placeholder="0">
            </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-1">
            <span class="fst-italic text-muted" style="font-size: 9px; max-width: 200px;">Use the measurement tool in the Square card to calculate Hole Square spacing and rotation.</span>
            <div>
                <button type="button" class="btn btn-secondary btn-sm me-1 py-0 px-2" onclick="closeExtendLatticeForm()">Cancel</button>
                <button type="button" class="btn btn-primary btn-sm py-0 px-2" onclick="submitExtendLatticeForm()">Submit</button>
            </div>
        </div>
    </form>
</div>

<!-- Background Overlay -->
<div id="dialogueOverlay" class="dialogue-overlay" onclick="closeExtendLatticeForm()"></div>
